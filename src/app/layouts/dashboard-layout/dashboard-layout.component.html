<div
  class="dashboard-shell"
  [class.drawer-is-open]="drawerOpen()"
  [class.sidebar-is-collapsed]="sidebarCollapsed()"
>
  <app-sidebar
    [collapsed]="sidebarCollapsed()"
    [drawerOpen]="drawerOpen()"
    [darkTheme]="darkTheme()"
    [navItems]="navItems"
    (toggleCollapsed)="toggleSidebar()"
    (toggleTheme)="toggleTheme()"
    (logout)="logout()"
  />

  @if (drawerOpen()) {
    <button
      type="button"
      class="drawer-backdrop"
      aria-label="Fechar menu"
      (click)="closeDrawer()"
    ></button>
  }

  <div class="dashboard-main">
    <header class="dashboard-header">
      <button
        type="button"
        class="mobile-menu-button"
        aria-label="Abrir menu"
        [attr.aria-expanded]="drawerOpen()"
        (click)="openDrawer()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>

      <div>
        <p class="mobile-brand">Maiawall Homolog</p>
        <h1>{{ getPageTitle() }}</h1>
      </div>

      <div class="header-actions">
        <a routerLink="/notifications" class="header-icon-button" aria-label="Abrir notificacoes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 01-3.46 0" />
          </svg>
        </a>
        @if (currentUser$ | async; as user) {
          <a routerLink="/profile" class="header-user">
            <span>{{ user.name }}</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5H7Z" /></svg>
          </a>
        }
      </div>
    </header>

    <main class="dashboard-content">
      <router-outlet />
    </main>
  </div>
</div>
