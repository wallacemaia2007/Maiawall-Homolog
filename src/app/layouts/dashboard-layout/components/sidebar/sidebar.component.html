<aside class="dashboard-sidebar" [class.is-collapsed]="collapsed()" [class.is-drawer-open]="drawerOpen()"
  aria-label="Navegacao principal">
  <div class="sidebar-top">
    <a class="sidebar-brand" routerLink="/dashboard" aria-label="Ir para o dashboard">
      <span class="brand-mark">MW</span>
      <span class="brand-copy">
        <strong>MAIAWALL</strong>
        <small>HOMOLOG</small>
      </span>
    </a>

    <button type="button" class="collapse-button"
      [attr.aria-label]="collapsed() ? 'Expandir sidebar' : 'Recolher sidebar'" [attr.aria-expanded]="!collapsed()"
      (click)="toggleCollapsed.emit()">
      <svg class="collapse-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="9 6 15 12 9 18" />
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems(); track item.route) {
    <a [routerLink]="item.route" routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }" class="sidebar-link"
      [attr.title]="collapsed() ? item.label : null" [attr.aria-label]="item.label">
      <span class="sidebar-icon" aria-hidden="true">
        @switch (item.icon) {
        @case ('dashboard') {
        <svg class="stroke-icon" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" />
        </svg>
        }
        @case ('projects') {
        <svg class="theme-icon" viewBox="0 0 24 24">
          <path
            d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4.2l2 2H18.5A2.5 2.5 0 0 1 21 8.5v7A2.5 2.5 0 0 1 18.5 18h-13A2.5 2.5 0 0 1 3 15.5v-9Z" />
        </svg>
        }
        @case ('notifications') {
        <svg class="stroke-icon" viewBox="0 0 24 24">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 01-3.46 0" />
        </svg>
        }
        @case ('pendencias') {
        <svg class="stroke-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        }
        @default {
        <svg class="stroke-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
        </svg>
        }
        }
      </span>
      <span class="link-label">{{ item.label }}</span>
    </a>
    }

    <a routerLink="/plans" routerLinkActive="is-active" class="sidebar-link"
      [attr.title]="collapsed() ? 'Planos' : null" aria-label="Planos">
      <span class="sidebar-icon" aria-hidden="true">
        <svg class="plan-icon" viewBox="0 0 24 24">
          <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z" />
        </svg>
      </span>
      <span class="link-label">Planos</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="sidebar-link theme-button" [attr.title]="collapsed() ? 'Alternar tema' : null"
      [attr.aria-label]="darkTheme() ? 'Ativar modo claro' : 'Ativar modo escuro'" (click)="toggleTheme.emit()">
      <span class="sidebar-icon" aria-hidden="true">
        @if (darkTheme()) {
        <svg class="theme-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        } @else {
        <svg class="theme-icon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        }
      </span>
      <span class="link-label">{{ darkTheme() ? 'Modo Claro' : 'Modo Escuro' }}</span>
    </button>

    <a routerLink="/profile" routerLinkActive="is-active" class="sidebar-link"
      [attr.title]="collapsed() ? 'Meu perfil' : null" aria-label="Meu perfil">
      <span class="sidebar-icon" aria-hidden="true">
        <svg class="stroke-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
        </svg>
      </span>
      <span class="link-label">Meu perfil</span>
    </a>

    <a routerLink="/configs" routerLinkActive="is-active" class="sidebar-link"
      [attr.title]="collapsed() ? 'Configuracoes' : null" aria-label="Configuracoes">
      <span class="sidebar-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path
            d="M19.4 13.5c.1-.5.1-1 .1-1.5s0-1-.1-1.5l2-1.5-2-3.5-2.4 1a8 8 0 0 0-2.6-1.5L14 2h-4l-.4 2.5A8 8 0 0 0 7 6L4.6 5l-2 3.5 2 1.5a8.8 8.8 0 0 0 0 3l-2 1.5 2 3.5L7 17a8 8 0 0 0 2.6 1.5L10 21h4l.4-2.5A8 8 0 0 0 17 17l2.4 1 2-3.5-2-1ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" />
        </svg>
      </span>
      <span class="link-label">Configuracoes</span>
    </a>

    <button type="button" class="sidebar-link logout-button" [attr.title]="collapsed() ? 'Sair' : null"
      aria-label="Sair" (click)="logout.emit()">
      <span class="sidebar-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M10 17v-3H3v-4h7V7l5 5-5 5Zm3 3v-2h5V6h-5V4h7v16h-7Z" />
        </svg>
      </span>
      <span class="link-label">Sair</span>
    </button>
  </div>
</aside>
