<aside
  class="dashboard-sidebar"
  [class.is-collapsed]="collapsed()"
  [class.is-drawer-open]="drawerOpen()"
  aria-label="Navegacao principal"
>
  <div class="sidebar-top">
    <a class="sidebar-brand" routerLink="/dashboard" aria-label="Ir para o dashboard">
      <span class="brand-mark">MW</span>
      <span class="brand-copy">
        <strong>MAIAWALL</strong>
        <small>HOMOLOG</small>
      </span>
    </a>

    <button
      type="button"
      class="collapse-button"
      [attr.aria-label]="collapsed() ? 'Expandir sidebar' : 'Recolher sidebar'"
      [attr.aria-expanded]="!collapsed()"
      (click)="toggleCollapsed.emit()"
    >
      <svg class="collapse-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m15 18-6-6 6-6" />
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="sidebar-link"
        [attr.title]="collapsed() ? item.label : null"
        [attr.aria-label]="item.label"
      >
        <span class="sidebar-icon" aria-hidden="true">
          @switch (item.icon) {
            @case ('dashboard') {
              <svg viewBox="0 0 24 24"><path d="M4 13h7V4H4v9Zm9 7h7V4h-7v16ZM4 20h7v-5H4v5Z" /></svg>
            }
            @case ('projects') {
              <svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4.2l2 2H18.5A2.5 2.5 0 0 1 21 8.5v7A2.5 2.5 0 0 1 18.5 18h-13A2.5 2.5 0 0 1 3 15.5v-9Z" /></svg>
            }
            @case ('notifications') {
              <svg viewBox="0 0 24 24"><path d="M12 22a2.4 2.4 0 0 0 2.3-1.7H9.7A2.4 2.4 0 0 0 12 22Zm7-6.5-1.7-2.2V9a5.3 5.3 0 1 0-10.6 0v4.3L5 15.5V18h14v-2.5Z" /></svg>
            }
            @default {
              <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0v1H5v-1Z" /></svg>
            }
          }
        </span>
        <span class="link-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <a
      routerLink="/profile"
      class="sidebar-link"
      [attr.title]="collapsed() ? 'Configuracoes' : null"
      aria-label="Configuracoes"
    >
      <span class="sidebar-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M19.4 13.5c.1-.5.1-1 .1-1.5s0-1-.1-1.5l2-1.5-2-3.5-2.4 1a8 8 0 0 0-2.6-1.5L14 2h-4l-.4 2.5A8 8 0 0 0 7 6L4.6 5l-2 3.5 2 1.5a8.8 8.8 0 0 0 0 3l-2 1.5 2 3.5L7 17a8 8 0 0 0 2.6 1.5L10 21h4l.4-2.5A8 8 0 0 0 17 17l2.4 1 2-3.5-2-1ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" /></svg>
      </span>
      <span class="link-label">Configuracoes</span>
    </a>

    <button
      type="button"
      class="sidebar-link logout-button"
      [attr.title]="collapsed() ? 'Sair' : null"
      aria-label="Sair"
      (click)="logout.emit()"
    >
      <span class="sidebar-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M10 17v-3H3v-4h7V7l5 5-5 5Zm3 3v-2h5V6h-5V4h7v16h-7Z" /></svg>
      </span>
      <span class="link-label">Sair</span>
    </button>
  </div>
</aside>
