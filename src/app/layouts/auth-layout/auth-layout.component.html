<div class="auth-shell min-h-screen w-full flex flex-col md:flex-row">
  <aside
    data-animate="panel"
    class="auth-panel relative overflow-hidden text-white md:w-[42%] md:min-h-screen flex flex-col justify-between px-6 py-6 md:px-14 md:py-14"
  >
    <div class="shape-grid" aria-hidden="true">
      @for (cell of shapeCells; track cell) {
        <span class="shape-cell" (pointerenter)="animateShape($event)"></span>
      }
    </div>

    <div data-animate="brand" class="relative z-10">
      <span class="font-display text-xl tracking-tight">Maiawall</span>
      <span
        class="ml-2 align-middle text-[11px] uppercase tracking-[0.14em] text-[var(--mw-accent-soft)] border border-white/15 rounded-full px-2 py-0.5"
      >
        Homologacao
      </span>
    </div>

    <div data-animate="headline" class="relative z-10 hidden md:block max-w-sm">
      <h1 class="font-display text-3xl md:text-[2.15rem] leading-tight font-medium">
        Seu projeto, mais perto de entrar em producao.
      </h1>
      <p class="mt-4 text-sm leading-relaxed text-white/60">
        Acompanhe versoes, revise alteracoes e aprove seu projeto antes da publicacao.
      </p>
    </div>

    <div aria-hidden="true"></div>
  </aside>

  <main class="auth-form-panel flex-1 flex items-center justify-center px-6 py-10 md:min-h-screen md:py-14">
    <div class="auth-form-slot w-full max-w-sm">
      <router-outlet />
    </div>
  </main>
</div>
