<section class="plan-summary" aria-label="Resumo do plano">
  <app-summary-cards [cards]="summaryCards" ariaLabel="Resumo financeiro do plano" [compact]="true" />

  <div class="benefits-count">
    <div class="benefit-item">
      <span class="count">{{ totalIncludedItems }}</span>
      <span class="label">Benefícios inclusos</span>
    </div>
    <div class="benefit-item">
      <span class="count">{{ activeExtrasCount }}</span>
      <span class="label">Custos extras ativos</span>
    </div>
  </div>
</section>
