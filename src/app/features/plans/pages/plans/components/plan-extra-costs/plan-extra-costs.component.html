<section class="extra-costs" aria-labelledby="extras-title">
  <header class="section-header">
    <div>
      <p class="eyebrow">{{ title() }}</p>
      <h3 id="extras-title">{{ subtitle() }}</h3>
    </div>
  </header>

  @if (extras().length > 0) {
    <div class="extras-grid">
      @for (extra of extras(); track extra.id) {
        <article class="extra-card" [class.is-selected]="isSelected(extra.id)">
          <div class="extra-header">
            <div>
              <h4>{{ extra.name }}</h4>
              @if (extra.description) {
                <p class="extra-description">{{ extra.description }}</p>
              }
            </div>
          </div>

          <div class="extra-action">
            <button
              type="button"
              class="consult-button"
              [class.is-selected]="isSelected(extra.id)"
              (click)="toggleExtra(extra)"
            >
              {{ isSelected(extra.id) ? 'Adicionado ao orçamento' : 'Adicionar para consultar' }}
            </button>
          </div>
        </article>
      }
    </div>
  } @else {
    <div class="empty-state">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10z" />
        <path d="M12 6v6l4 2" />
      </svg>
      <p>Nenhum custo adicional cadastrado.</p>
    </div>
  }

</section>
