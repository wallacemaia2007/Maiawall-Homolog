<div class="notfound-shell min-h-screen w-full flex flex-col">

  <header data-animate="brand" class="px-6 py-6 md:px-14 md:py-10">
    <span class="font-display text-xl tracking-tight text-[var(--mw-text)]">Maiawall</span>
    <span
      class="ml-2 align-middle text-[11px] uppercase tracking-[0.14em] text-[var(--mw-accent)] border border-[var(--mw-border)] rounded-full px-2 py-0.5">
      Homologação
    </span>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 pb-16">
    <div class="notfound-content w-full max-w-md text-center">

      <p data-animate="code" class="font-display text-7xl md:text-8xl font-medium text-[var(--mw-text)] leading-none">
        404
      </p>

      <div data-animate="message" class="mt-6">
        <h1 class="font-display text-xl md:text-2xl font-medium text-[var(--mw-text)]">
          Página não encontrada
        </h1>
        <p class="mt-2.5 text-sm leading-relaxed text-[var(--mw-text-muted)]">
          O endereço que você tentou acessar não existe, foi movido ou o projeto
          em homologação já não está mais disponível nesse link.
        </p>
      </div>

      <div data-animate="cta" class="mt-9 flex flex-col sm:flex-row items-center justify-center gap-3">
        <a routerLink="/login"
          class="w-full sm:w-auto rounded-lg bg-[var(--mw-accent)] text-white text-sm font-medium px-6 py-2.5 transition-colors hover:bg-[var(--mw-accent-hover)] focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[var(--mw-accent)]">
          Voltar para o login
        </a>
        <a [href]="sendMessage()"
          class="w-full sm:w-auto rounded-lg border border-[var(--mw-border)] text-[var(--mw-text)] text-sm font-medium px-6 py-2.5 transition-colors hover:border-[var(--mw-accent)] hover:text-[var(--mw-accent)] focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[var(--mw-accent)]">
          Falar com a Maiawall
        </a>
      </div>
    </div>
  </main>

  <footer class="text-center text-[11px] text-[var(--mw-text-faint)] px-6 pb-8">
    © 2026 Maiawall. Todos os direitos reservados.
  </footer>
</div>
