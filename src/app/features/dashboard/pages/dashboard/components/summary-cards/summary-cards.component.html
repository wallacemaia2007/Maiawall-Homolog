<section class="summary-grid" [class.is-compact]="compact()" [attr.aria-label]="ariaLabel()">
  @for (card of displayCards(); track card.label) {
    <article class="summary-card" [class.highlight]="card.highlight">
      <span>{{ card.label }}</span>
      <strong>{{ card.value }}</strong>
    </article>
  }
</section>
