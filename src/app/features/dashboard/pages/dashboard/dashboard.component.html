@if (loading()) {
  <section class="dashboard-loading" aria-live="polite">Carregando dashboard...</section>
} @else {
  <div class="dashboard-page">
    <app-welcome-section [user]="user()" />

    <app-summary-cards [summary]="summary()" />

    <section class="dashboard-grid">
      <app-project-progress [project]="progressProject()" />
      <app-primary-project [project]="primaryProject()" />
    </section>

    <app-recent-activity [activities]="activities()" />
  </div>
}
